<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to CropSense.AI — your AI-powered crop disease detection platform.">
    <title>Login — CropSense.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Header & Navbar -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/" class="navbar-brand" id="nav-brand-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                    <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                </svg>
                <span>CropSense.AI</span>
            </a>
            <nav>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="/" class="nav-link" id="nav-home">Home</a></li>
                    <li><a href="/signup" class="nav-link nav-auth nav-signup" id="nav-signup">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card" id="login-card">

                <!-- Brand mark -->
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                        <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                    </svg>
                    <span>CropSense.AI</span>
                </div>

                <h1 class="auth-heading">Welcome back</h1>
                <p class="auth-sub">Sign in to your account to continue</p>

                <!-- Error banner -->
                <div class="auth-alert auth-alert--error" id="login-error" role="alert" aria-live="polite">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="login-error-text"></span>
                </div>

                <form class="auth-form" id="login-form" novalidate>
                    <!-- Email -->
                    <div class="auth-field">
                        <label class="auth-label" for="login-email">Email address</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                            <input type="email" id="login-email" name="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-field">
                        <label class="auth-label" for="login-password">Password</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="login-password" name="password" class="auth-input" placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="auth-eye-btn" id="toggle-login-password" aria-label="Toggle password visibility">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="login-submit-btn">
                        <span id="login-btn-text">Sign In</span>
                        <svg id="login-spinner" class="auth-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="display:none;">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                    </button>
                </form>

                <p class="auth-switch-text">
                    Don't have an account? <a href="/signup" id="switch-to-signup">Create one free</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <a href="/" class="footer-logo" id="footer-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                    <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                </svg>
                <span>CropSense.AI</span>
            </a>
            <div class="footer-text" id="footer-text-copyright">
                CropSense.AI &copy; 2025 | Powered by Gemini AI
            </div>
        </div>
    </footer>

    <script>
    (function () {
        const form = document.getElementById('login-form');
        const errorBanner = document.getElementById('login-error');
        const errorText = document.getElementById('login-error-text');
        const submitBtn = document.getElementById('login-submit-btn');
        const btnText = document.getElementById('login-btn-text');
        const spinner = document.getElementById('login-spinner');
        const toggleBtn = document.getElementById('toggle-login-password');
        const pwInput = document.getElementById('login-password');

        // Toggle password visibility
        toggleBtn.addEventListener('click', function () {
            const isText = pwInput.type === 'text';
            pwInput.type = isText ? 'password' : 'text';
            toggleBtn.style.opacity = isText ? '1' : '0.5';
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorBanner.classList.add('show');
        }
        function hideError() {
            errorBanner.classList.remove('show');
        }
        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.textContent = loading ? 'Signing in…' : 'Sign In';
            spinner.style.display = loading ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('login-email').value.trim();
            const password = pwInput.value;

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            setLoading(true);
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/analyze';
                } else {
                    showError(data.error || 'Login failed. Please try again.');
                }
            } catch (err) {
                showError('Network error. Please check your connection and try again.');
            } finally {
                setLoading(false);
            }
        });
    })();
    </script>

</body>
</html>
