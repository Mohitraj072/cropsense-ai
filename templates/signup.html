<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your free CropSense.AI account — AI-powered crop disease detection for farmers and agronomists.">
    <title>Sign Up — CropSense.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Header & Navbar -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/" class="navbar-brand" id="nav-brand-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                    <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                </svg>
                <span>CropSense.AI</span>
            </a>
            <nav>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="/" class="nav-link" id="nav-home">Home</a></li>
                    <li><a href="/login" class="nav-link nav-auth" id="nav-login">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card" id="signup-card">

                <!-- Brand mark -->
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                        <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                    </svg>
                    <span>CropSense.AI</span>
                </div>

                <h1 class="auth-heading">Create your account</h1>
                <p class="auth-sub">Start detecting crop diseases in seconds — free forever</p>

                <!-- Error banner -->
                <div class="auth-alert auth-alert--error" id="signup-error" role="alert" aria-live="polite">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="signup-error-text"></span>
                </div>

                <!-- Success banner -->
                <div class="auth-alert auth-alert--success" id="signup-success" role="status" aria-live="polite">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <span id="signup-success-text"></span>
                </div>

                <form class="auth-form" id="signup-form" novalidate>

                    <!-- Full Name -->
                    <div class="auth-field">
                        <label class="auth-label" for="signup-name">Full name</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="signup-name" name="name" class="auth-input" placeholder="John Doe" autocomplete="name" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="auth-field">
                        <label class="auth-label" for="signup-email">Email address</label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                            </svg>
                            <input type="email" id="signup-email" name="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-field">
                        <label class="auth-label" for="signup-password">
                            Password
                            <span class="auth-label-hint">At least 6 characters</span>
                        </label>
                        <div class="auth-input-wrap">
                            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="signup-password" name="password" class="auth-input" placeholder="••••••••" autocomplete="new-password" required minlength="6">
                            <button type="button" class="auth-eye-btn" id="toggle-signup-password" aria-label="Toggle password visibility">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <!-- Password strength meter -->
                        <div class="pw-strength-bar-wrap" id="pw-strength">
                            <div class="pw-strength-bar" id="strength-bar"></div>
                        </div>
                        <span class="pw-strength-label" id="strength-label"></span>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit" id="signup-submit-btn">
                        <span id="signup-btn-text">Create Account</span>
                        <svg id="signup-spinner" class="auth-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="display:none;">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                    </button>
                </form>

                <p class="auth-switch-text">
                    Already have an account? <a href="/login" id="switch-to-login">Sign in here</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <a href="/" class="footer-logo" id="footer-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.58 1 9.2a7.07 7.07 0 0 1-7.6 8.8Z" />
                    <path d="M19 2c-2.26 4.33-5.27 7.14-8 10" />
                </svg>
                <span>CropSense.AI</span>
            </a>
            <div class="footer-text" id="footer-text-copyright">
                CropSense.AI &copy; 2025 | Powered by Gemini AI
            </div>
        </div>
    </footer>

    <script>
    (function () {
        const form = document.getElementById('signup-form');
        const errorBanner = document.getElementById('signup-error');
        const errorText = document.getElementById('signup-error-text');
        const successBanner = document.getElementById('signup-success');
        const successText = document.getElementById('signup-success-text');
        const submitBtn = document.getElementById('signup-submit-btn');
        const btnText = document.getElementById('signup-btn-text');
        const spinner = document.getElementById('signup-spinner');
        const toggleBtn = document.getElementById('toggle-signup-password');
        const pwInput = document.getElementById('signup-password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLabel = document.getElementById('strength-label');

        // Toggle password visibility
        toggleBtn.addEventListener('click', function () {
            const isText = pwInput.type === 'text';
            pwInput.type = isText ? 'password' : 'text';
            toggleBtn.style.opacity = isText ? '1' : '0.5';
        });

        // Password strength meter
        pwInput.addEventListener('input', function () {
            const val = pwInput.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong', 'Very strong'];
            const colors = ['', '#ef4444', '#f97316', '#eab308', '#22c55e', '#16a34a'];
            const pct = val.length === 0 ? 0 : Math.min(100, score * 20);

            strengthBar.style.width = pct + '%';
            strengthBar.style.backgroundColor = colors[score] || '#e5e7eb';
            strengthLabel.textContent = val.length > 0 ? labels[score] || '' : '';
            strengthLabel.style.color = colors[score] || '';
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorBanner.classList.add('show');
            successBanner.classList.remove('show');
        }
        function showSuccess(msg) {
            successText.textContent = msg;
            successBanner.classList.add('show');
            errorBanner.classList.remove('show');
        }
        function hideAlerts() {
            errorBanner.classList.remove('show');
            successBanner.classList.remove('show');
        }
        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.textContent = loading ? 'Creating account…' : 'Create Account';
            spinner.style.display = loading ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlerts();

            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = pwInput.value;

            if (!name) { showError('Please enter your full name.'); return; }
            if (!email) { showError('Please enter a valid email address.'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters long.'); return; }

            setLoading(true);
            try {
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    showSuccess('Account created! Redirecting…');
                    setTimeout(() => { window.location.href = data.redirect || '/analyze'; }, 800);
                } else {
                    showError(data.error || 'Sign-up failed. Please try again.');
                }
            } catch (err) {
                showError('Network error. Please check your connection and try again.');
            } finally {
                setLoading(false);
            }
        });
    })();
    </script>

</body>
</html>
